<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Sistemas - Lyra the Wise</title>
    <link rel="icon" href="/assets/tokens/lyra.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/modules/gm-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;700&family=Montserrat:wght@300;400;600&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #060b13;
            color: #d4af37;
            padding: 2rem;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        .diagnose-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 4rem);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.8rem;
            flex-shrink: 0;
        }

        .header-title-block {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-title-block i {
            font-size: 2.2rem;
            color: var(--gold);
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
        }

        h1.medieval-font {
            font-family: 'Grenze Gotisch', cursive;
            font-size: 2.4rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .diagnose-main-layout {
            display: flex;
            gap: 2rem;
            flex: 1;
            overflow: hidden;
            min-height: 0; /* Permite scroll correto em flex containers */
        }

        /* Coluna da Esquerda: Sistemas */
        .systems-panel {
            flex: 1.2;
            background: rgba(13, 22, 34, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .systems-panel-title {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--gold-bright);
            margin-top: 0;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-shrink: 0;
        }

        .systems-list-scroll {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            flex: 1;
        }

        /* Card de Sistemas */
        .system-audit-card {
            background: rgba(20, 28, 40, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            padding: 1.2rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            position: relative;
            overflow: hidden;
        }

        .system-audit-card:hover {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
            transform: translateY(-2px);
        }

        .system-audit-card.active-run {
            border-color: var(--gold-bright);
            background: rgba(30, 42, 60, 0.95);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }

        .system-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .system-title-block {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .system-card-icon {
            font-size: 2rem;
            color: var(--gold);
            width: 2.5rem;
            text-align: center;
        }

        .system-meta {
            display: flex;
            flex-direction: column;
        }

        .system-name {
            font-family: 'Cinzel', serif;
            font-size: 1.15rem;
            color: #fff;
            font-weight: bold;
        }

        .system-id-ver {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 0.15rem;
        }

        /* Coluna da Direita: Terminal e Diagnóstico */
        .audit-visualizer-panel {
            flex: 1.8;
            background: rgba(13, 22, 34, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .visualizer-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            gap: 1rem;
            border: 1px dashed rgba(212, 175, 55, 0.15);
            border-radius: 6px;
        }

        .visualizer-placeholder i {
            font-size: 3.5rem;
            color: rgba(212, 175, 55, 0.2);
        }

        /* Layout Interno do Visualizador de Diagnóstico */
        .diagnostic-workspace {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .diagnostic-main-layout {
            display: flex;
            flex: 1;
            gap: 1.2rem;
            overflow: hidden;
            min-height: 0;
            margin-bottom: 0.8rem;
        }

        .diagnostic-steps-panel {
            flex: 1;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 8px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .diagnostic-steps-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .diagnostic-step-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            padding: 0.45rem 0.6rem;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.01);
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .diagnostic-step-item.pending {
            border-left-color: var(--gold);
            background: rgba(212, 175, 55, 0.04);
        }

        .diagnostic-step-item.success {
            border-left-color: #2ecc71;
            background: rgba(46, 204, 113, 0.04);
        }

        .diagnostic-step-item.failed {
            border-left-color: #e74c3c;
            background: rgba(231, 76, 60, 0.04);
        }

        .step-icon {
            font-size: 0.9rem;
            width: 1.1rem;
            text-align: center;
        }

        .step-icon.spinning {
            color: var(--gold);
            animation: spin 1s linear infinite;
        }

        .step-icon.check { color: #2ecc71; }
        .step-icon.cross { color: #e74c3c; }

        .step-text {
            flex: 1;
            color: rgba(255, 255, 255, 0.75);
        }

        .step-text strong {
            color: #fff;
        }

        /* Coluna da Direita (Terminal) */
        .diagnostic-code-panel {
            flex: 1.3;
            background: #040911;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }

        .code-panel-header {
            background: #070e1a;
            padding: 0.4rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .terminal-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .terminal-dot.red { background: #e74c3c; }
        .terminal-dot.yellow { background: #f1c40f; }
        .terminal-dot.green { background: #2ecc71; }

        .terminal-title {
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.35);
            margin-left: 0.4rem;
        }

        .code-panel-body {
            flex: 1;
            padding: 0.8rem;
            overflow-y: auto;
            font-family: 'Fira Code', 'Courier New', monospace;
            font-size: 0.75rem;
            line-height: 1.35;
            color: #4df3ff;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            scroll-behavior: smooth;
        }

        .code-line {
            opacity: 0.9;
            white-space: pre-wrap;
            animation: fadeInSlide 0.15s ease-out forwards;
        }

        .code-comment {
            color: #7f8c8d;
            font-style: italic;
        }

        .code-keyword {
            color: #ff79c6;
            font-weight: bold;
        }

        .code-func {
            color: #50fa7b;
        }

        .code-output {
            color: #f1c40f;
            padding-left: 0.6rem;
            border-left: 2px solid rgba(241, 196, 15, 0.25);
            margin-top: 0.05rem;
            margin-bottom: 0.2rem;
            font-size: 0.7rem;
        }

        .code-error {
            color: #ff5555;
            padding-left: 0.6rem;
            border-left: 2px solid rgba(255, 85, 85, 0.25);
            margin-top: 0.05rem;
            margin-bottom: 0.2rem;
            font-size: 0.7rem;
        }

        /* Rodapé de Resultados */
        .diagnostic-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            padding-top: 0.8rem;
            flex-shrink: 0;
            animation: slideUp 0.3s ease-out forwards;
        }

        .diagnostic-summary {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .diagnostic-summary-icon {
            font-size: 1.4rem;
        }

        .diagnostic-summary-icon.success {
            color: #2ecc71;
            animation: pulse-icon 1.5s infinite;
        }

        .diagnostic-summary-icon.failed {
            color: #e74c3c;
            animation: shake 1.5s infinite;
        }

        .diagnostic-summary-text h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            margin: 0;
            color: #fff;
        }

        .diagnostic-summary-text p {
            font-size: 0.75rem;
            margin: 0.1rem 0 0 0;
            color: rgba(255, 255, 255, 0.5);
        }

        .modules-integrity-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .integrity-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .integrity-group-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
        }

        .integrity-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .integrity-badge {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .integrity-badge.ok {
            border-color: rgba(46, 204, 113, 0.4);
            background: rgba(46, 204, 113, 0.05);
            color: #2ecc71;
        }

        .integrity-badge.error {
            border-color: rgba(231, 76, 60, 0.4);
            background: rgba(231, 76, 60, 0.05);
            color: #e74c3c;
        }

        .integrity-badge.optional {
            border-color: rgba(241, 196, 15, 0.4);
            background: rgba(241, 196, 15, 0.05);
            color: #f1c40f;
        }

        .integrity-badge.missing-optional {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body class="medieval-theme">
    <div class="diagnose-container">
        <header>
            <div class="header-title-block">
                <i class="fa-solid fa-scroll-torah"></i>
                <h1 class="medieval-font">Templo de Auditoria de Sistemas</h1>
            </div>
            <div class="user-info">
                <button class="medieval-btn small secondary" onclick="window.close()">
                    <i class="fas fa-arrow-left"></i> Fechar Janela
                </button>
                <span id="admin-status" style="margin-left: 15px;">GM Autenticado</span>
            </div>
        </header>

        <main class="diagnose-main-layout">
            <!-- Lado Esquerdo: Lista de Motores -->
            <section class="systems-panel">
                <h2 class="systems-panel-title">
                    <i class="fas fa-microchip"></i> Motores RPG Instalados
                </h2>
                <div class="systems-list-scroll" id="diagnose-systems-list">
                    <!-- Cards dos sistemas populados dinamicamente pelo JS -->
                </div>
            </section>

            <!-- Lado Direito: Visualizador em Tempo Real da Execução -->
            <section class="audit-visualizer-panel" id="diagnose-visualizer-panel">
                <div class="visualizer-placeholder" id="visualizer-placeholder">
                    <i class="fa-solid fa-gauge-high"></i>
                    <h3>Aguardando Escolha</h3>
                    <p>Selecione um motor de regras à esquerda para iniciar o rito de auditoria e monitoramento.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Scripts da Aplicação (importa o mesmo SystemRegistry do app e seus side-effects) -->
    <script type="module" src="js/modules/diagnose.js"></script>
</body>

</html>

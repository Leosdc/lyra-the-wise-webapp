<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoria de Banco - Lyra the Wise</title>
    <link rel="icon" href="/assets/tokens/lyra.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/modules/gm-panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@400;700&family=Montserrat:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #0a0a0c;
            color: #d4af37;
            padding: 2rem;
            min-height: 100vh;
        }

        .audit-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 1rem;
        }

        .audit-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 2rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-group label {
            font-family: 'Grenze Gotisch', cursive;
            font-size: 1.2rem;
        }

        .result-stats {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .audit-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .audit-card {
            background: rgba(20, 20, 25, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.2);
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .audit-card:hover {
            border-color: var(--gold);
            background: rgba(30, 30, 40, 0.9);
            transform: translateX(5px);
        }

        .card-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .card-subtext {
            font-size: 0.85rem;
            color: #aaa;
        }

        .card-actions {
            display: flex;
            gap: 10px;
        }

        .card-actions .delete-btn {
            background: #4a0404;
            color: #ff4d4d;
            border: 1px solid #7a0000;
        }

        .card-actions .delete-btn:hover {
            background: #7a0000;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .hidden {
            display: none !important;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            border: 1px dashed rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            opacity: 0.6;
        }
    </style>
</head>

<body class="medieval-theme">
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="stat-bubble" style="width: auto; padding: 2rem;">
            <i class="fas fa-quill fa-spin"></i>
            <span id="loading-text">Consultando os anais...</span>
        </div>
    </div>

    <div class="audit-container">
        <header>
            <h1 class="medieval-font"><i class="fas fa-database"></i> Auditoria de Banco de Dados</h1>
            <div class="user-info">
                <button class="medieval-btn small secondary" onclick="window.close()">
                    <i class="fas fa-arrow-left"></i> Fechar Janela
                </button>
                <span id="admin-status" style="margin-left: 15px;">GM Autenticado</span>
            </div>
        </header>

        <section class="audit-controls">
            <div class="control-group">
                <label for="audit-user-select">Selecionar Viajante</label>
                <select id="audit-user-select" class="medieval-select">
                    <option value="">-- Escolha um Usuário --</option>
                </select>
            </div>
            <div class="control-group">
                <label for="audit-category-select">Categoria de Registro</label>
                <select id="audit-category-select" class="medieval-select">
                    <option value="CHARACTERS">Personagens (Fichas)</option>
                    <option value="USER_ITEMS">Itens Criados</option>
                    <option value="USER_MONSTERS">Monstros Customizados</option>
                    <option value="USER_SPELLS">Magias Customizadas</option>
                    <option value="NPCS">NPCs</option>

                    <option value="CAMPAIGNS">Campanhas</option>
                    <option value="ENCOUNTERS">Encontros</option>
                    <option value="PUZZLES">Puzzles</option>
                    <option value="TREASURES">Tesouros</option>
                    <option value="SCENES">Cenas</option>
                    <option value="PLOTS">Tramas</option>
                    <option value="MOTIVATIONS">Motivações</option>
                    <option value="RULES">Regras</option>
                    <option value="NAMES">Nomes</option>
                    <option value="TRAPS">Armadilhas</option>
                </select>
            </div>
        </section>

        <div id="result-stats" class="result-stats hidden">
            Encontrados <span id="record-count">0</span> registros para esta categoria.
        </div>

        <section id="audit-results" class="audit-list">
            <div class="empty-state">
                <i class="fas fa-search" style="font-size: 3rem; margin-bottom: 1rem;"></i>
                <p>Selecione um usuário para iniciar a auditoria.</p>
            </div>
        </section>
    </div>

    <script type="module" src="js/modules/audit.js"></script>
</body>

</html>
